name: C build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcrypt-dev
      - name: Strict release build
        run: make clean all
      - name: ASan/UBSan build
        run: make debug
